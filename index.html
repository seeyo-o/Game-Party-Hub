<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Discord Party Game Hub 🎉</title>
  <meta name="description" content="Koleksi party game seru untuk nongkrong di Discord Voice Chat bersama teman-teman!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

  <!-- Google Fonts: Fredoka & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fredoka', 'cursive', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            theme: {
              bg: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              primary: 'var(--color-primary)',
              'primary-hover': 'var(--color-primary-hover)',
              'primary-light': 'var(--color-primary-light)',
              accent: 'var(--color-accent)',
              'accent-hover': 'var(--color-accent-hover)',
              text: 'var(--color-text)',
              muted: 'var(--color-muted)',
              border: 'var(--color-border)',
            }
          },
          boxShadow: {
            'joyful': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05)',
            'joyful-lg': '0 20px 30px -10px rgba(0, 0, 0, 0.08), 0 12px 14px -8px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- App Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="lobby" class="bg-theme-bg text-theme-text antialiased selection:bg-indigo-100 selection:text-indigo-900 min-h-screen flex flex-col justify-between">

  <!-- Main View Container -->
  <div id="app" class="flex-1 flex flex-col w-full max-w-6xl mx-auto px-4 py-4 sm:py-6 transition-all duration-300">
    <!-- View rendered dynamically via JavaScript -->
  </div>

  <!-- Staging Containers for Modular Game Views -->
  <div id="werewolf-view" class="hidden"></div>
  <div id="coup-view" class="hidden"></div>
  <div id="costume-detective-view" class="hidden"></div>
  <div id="spicy-view" class="hidden"></div>
  <div id="trio-view" class="hidden"></div>
  <div id="secret-hitler-view" class="hidden"></div>

  <!-- Reusable Modal Container -->
  <div id="modal-container" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-200">
    <div id="modal-content" class="w-full max-w-lg transform transition-transform duration-200 scale-95 opacity-0"></div>
  </div>

  <!-- Reusable Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none max-w-sm w-full px-3"></div>

  <!-- Core Modules -->
  <script src="js/core/ui-components.js"></script>
  <script src="js/core/firebase-service.js"></script>
  <script src="js/core/game-rules.js"></script>

  <!-- Games Modules -->
  <script src="js/games/tentang-kita.js"></script>
  <script src="js/games/voting-game.js"></script>
  <script src="js/games/guess-who.js"></script>
  <script src="js/games/werewolf.js"></script>
  <script src="js/games/coup.js"></script>
  <script src="js/games/costume-detective.js"></script>

  <!-- App Main Orchestrator -->
  <script src="js/app.js"></script>
</body>
</html>
